<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Diagnóstico — Soporte en Sitio</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="index.module.css">
</head>
<body class="login-page">
  <div id="toast-container"></div>

  <main class="login-main">
    <div class="login-card">
      <img class="login-card__logo" src="../assets/logo/Logo-Teknologia.jpg" alt="">
      <div class="login-card__encabezado">
        <h1 class="login-card__titulo"><span class="titulo-oscuro">Soporte</span> <span class="titulo-claro">en Sitio</span></h1>
        <p class="login-card__subtitulo">Módulo de diagnóstico</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="campo">
          <label for="usuario">Cédula</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            inputmode="numeric"
            pattern="[0-9]+"
            placeholder="Ingresa tu número de cédula"
            autocomplete="username"
            required
          >
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn--primario btn--full login-submit-btn" id="btn-ingresar">
          Ingresar
        </button>
      </form>
      <p class="login-card__ayuda">Si olvidaste tu contraseña, contacta al administrador del sistema.</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Sistema de Diagnóstico Web - Soporte en Sitio — Todos los derechos reservados</p>
  </footer>

  <script src="../js/shared/session.js"></script>
  <script type="module" src="../js/index.js"></script>
</body>
</html>
