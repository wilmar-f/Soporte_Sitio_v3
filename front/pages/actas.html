<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actas — Diagnóstico</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="usuario.module.css">
  <link rel="stylesheet" href="actas.module.css">
</head>
<body>
  <div id="toast-container"></div>

  <main class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__marca">
        <img class="sidebar__logo" src="../assets/logo/Logo-Teknologia.jpg" alt="">
      </div>
      <div class="sidebar__perfil">
        <div class="sidebar__avatar" id="user-avatar" aria-hidden="true"></div>
        <p class="sidebar__bienvenida">Bienvenido,</p>
        <p class="sidebar__nombre" id="user-nombre">—</p>
        <p class="sidebar__correo" id="user-correo">—</p>
        <p class="sidebar__ultimo-acceso" id="user-ultimo-acceso"></p>
        <span class="sidebar__rol" id="user-rol">—</span>
      </div>
      <nav class="sidebar__nav" aria-label="Menú principal">
        <button type="button" class="sidebar__btn" id="btn-usuarios">
          <span class="sidebar__btn-icono">👥</span>
          Usuarios
        </button>
        <button type="button" class="sidebar__btn" id="btn-reportes">
          <span class="sidebar__btn-icono">📊</span>
          Reportes
        </button>
        <button type="button" class="sidebar__btn" id="btn-diagnostico-beta">
          <span class="sidebar__btn-icono">📋</span>
          Diagnóstico IA
        </button>
        <button type="button" class="sidebar__btn" id="btn-diagnostico">
          <span class="sidebar__btn-icono">📋</span>
          Diagnóstico
        </button>
        <button type="button" class="sidebar__btn sidebar__btn--activo" id="btn-actas">
          <span class="sidebar__btn-icono">📄</span>
          Actas Activos
        </button>
        <button class="sidebar__btn" id="btn-videoconferencia">
          <span class="sidebar__btn-icono">📷</span>
          VideoConferencia
        </button>
        <button type="button" class="sidebar__btn sidebar__btn--secundario" id="btn-cambiar-clave">
          <span class="sidebar__btn-icono">🔑</span>
          Cambiar contraseña
        </button>
        <button class="sidebar__btn sidebar__btn--peligro" id="btn-cerrar-sesion">
          <span class="sidebar__btn-icono">🚪</span>
          Cerrar Sesión
        </button>
      </nav>
      <script src="../js/sidebar-rol.js"></script>
    </aside>

    <section class="panel-principal" id="panel-principal" aria-live="polite">
      <div class="panel-bienvenida" id="panel-bienvenida">
        <div class="panel-bienvenida__icono">📄</div>
        <h2><span class="titulo-oscuro">Actas</span><span class="titulo-claro"> de novedades</span></h2>
        <p>Haz clic en <strong>Actas</strong> en el menú lateral para abrir el formulario.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sistema de Diagnóstico Web - Soporte en Sitio — Todos los derechos reservados</p>
  </footer>

  <script type="module" src="../js/actas.js"></script>
</body>
</html>
